<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Muskan — QR Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a0a0a;
    font-family: 'Jost', sans-serif;
    padding: 32px 16px;
  }

  .card {
    width: 380px;
    background: linear-gradient(160deg, #fdf0f0 0%, #f5d6d6 40%, #fce8e8 100%);
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(201,112,112,0.2),
      0 40px 80px rgba(80,10,10,0.5),
      0 0 120px rgba(201,112,112,0.15);
    position: relative;
    animation: cardIn 1s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Top photo strip */
  .photo-strip {
    width: 100%;
    height: 200px;
    position: relative;
    overflow: hidden;
  }

  .photo-strip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .photo-strip::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;right: 0;
    height: 80px;
    background: linear-gradient(180deg, transparent, #fdf0f0);
  }

  /* Petal decoration */
  .petals {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 1.4rem;
    opacity: 0.7;
    animation: sway 3s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .body {
    padding: 8px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .eyebrow {
    font-size: 0.6rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #c97070;
    margin-bottom: 4px;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.6rem;
    font-style: italic;
    font-weight: 300;
    color: #3a1515;
    line-height: 1;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 0.75rem;
    color: #7a4444;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 24px;
    font-weight: 300;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
  }

  /* QR frame */
  .qr-frame {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-shadow:
      0 4px 20px rgba(201,112,112,0.15),
      0 0 0 1px rgba(201,112,112,0.2);
    position: relative;
    margin-bottom: 20px;
  }

  .qr-frame img {
    width: 180px;
    height: 180px;
    display: block;
    border-radius: 8px;
  }

  /* Corner roses */
  .qr-frame::before,
  .qr-frame::after {
    content: '🌸';
    position: absolute;
    font-size: 1rem;
  }
  .qr-frame::before { top: -8px; left: -8px; }
  .qr-frame::after { bottom: -8px; right: -8px; }

  .scan-text {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #c97070;
    margin-bottom: 20px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .url {
    font-size: 0.65rem;
    color: #b06060;
    letter-spacing: 0.05em;
    margin-bottom: 24px;
    opacity: 0.7;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e8a0a0, transparent);
    margin-bottom: 20px;
  }

  .footer-quote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: #7a4444;
    text-align: center;
    line-height: 1.5;
  }

  .heart {
    display: inline-block;
    animation: heartbeat 1.4s ease-in-out infinite;
    color: #c97070;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.25); }
    28% { transform: scale(1); }
    42% { transform: scale(1.15); }
  }

  /* Background roses pattern */
  .card::before {
    content: '🌸 🌷 🌸 🌷 🌸 🌷 🌸 🌷 🌸 🌷';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.7rem;
    opacity: 0.12;
    letter-spacing: 4px;
    pointer-events: none;
    padding: 8px;
  }
</style>
</head>
